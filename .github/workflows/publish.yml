name: publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/injection-bisect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: false
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp test run
      - run: vp run build
      - run: vp pm pack --out "$RUNNER_TEMP/package.tgz"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_JSON: ${{ github.workspace }}/libs/injection-bisect/package.json
        run: |
          name="$(jq -r .name "$PACKAGE_JSON")"
          version="$(jq -r .version "$PACKAGE_JSON")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, skipping"
            exit 0
          fi
          npm publish "$RUNNER_TEMP/package.tgz" --provenance --access public

  ci-telemetry:
    needs: [publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            apps/web/app-name.ts
          sparse-checkout-cone-mode: false
      - run: .github/scripts/ci-telemetry.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
