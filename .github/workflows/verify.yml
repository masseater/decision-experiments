name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: masseater/typescript-template/.github/actions/verify@9fd918dd489a841010b0a5fb6e4ed9d1f8a11ec1
        with:
          github-token: ${{ github.token }}

  autofix:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          -f run_id="$FAILED_RUN_ID" -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF_NAME" --jq .sha)"
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.latest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.head.outputs.latest == 'true'
        uses: $/.github/actions/setup
      - if: steps.head.outputs.latest == 'true'
        uses: masseater/typescript-template/.github/actions/credentials@9fd918dd489a841010b0a5fb6e4ed9d1f8a11ec1
      - if: steps.head.outputs.latest == 'true'
        run: vp exec alchemy deploy --stage production --yes
        working-directory: apps/web
      - if: steps.head.outputs.latest == 'true'
        uses: masseater/typescript-template/.github/actions/credentials@9fd918dd489a841010b0a5fb6e4ed9d1f8a11ec1
      - if: steps.head.outputs.latest == 'true'
        run: vp exec alchemy deploy --stage production --yes
        working-directory: apps/ocr-decide
      - if: steps.head.outputs.latest == 'true'
        uses: masseater/typescript-template/.github/actions/credentials@9fd918dd489a841010b0a5fb6e4ed9d1f8a11ec1
      - if: steps.head.outputs.latest == 'true'
        run: vp exec alchemy deploy --stage production --yes
        working-directory: apps/decision-bench

  release:
    needs: verify
    if: github.repository == 'masseater/typescript-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-pull-request: true
      - if: github.event_name == 'workflow_dispatch'
        id: app-token
        run: |
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masseater-dev-credential-broker" | jq -er .value)"
          echo "::add-mask::$oidc"
          token="$(curl -fsS --retry 3 -X POST -H "Authorization: Bearer $oidc" \
            "https://credentials.masseater.dev/" | jq -er .githubToken)"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-release: true

  release-lib:
    needs: verify
    if: github.repository == 'masseater/decision-experiments'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    concurrency:
      group: release-lib
    steps:
      - id: tagged
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/lib-config.json
          manifest-file: .github/release-please/lib-manifest.json
          skip-github-pull-request: true
      - if: github.event_name == 'workflow_dispatch'
        id: app-token
        run: |
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masseater-dev-credential-broker" | jq -er .value)"
          echo "::add-mask::$oidc"
          token="$(curl -fsS --retry 3 -X POST -H "Authorization: Bearer $oidc" \
            "https://credentials.masseater.dev/" | jq -er .githubToken)"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please/lib-config.json
          manifest-file: .github/release-please/lib-manifest.json
          skip-github-release: true
      - if: steps.tagged.outputs['libs/injection-bisect--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tagged.outputs['libs/injection-bisect--tag_name'] }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"

  ci-telemetry:
    needs: [verify, autofix, deploy, release, release-lib]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@9fd918dd489a841010b0a5fb6e4ed9d1f8a11ec1
        with:
          github-token: ${{ github.token }}
